<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Animated FreeRTOS task interaction map" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient><linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient><linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient><pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.12"/></pattern><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="20" fill="#0b1226"/><rect width="100%" height="100%" rx="20" fill="url(#gr)"/><text x="40" y="40" font-size="22" font-weight="900" fill="#e0f2fe" letter-spacing="3">FREERTOS TASK INTERACTION</text><text x="40" y="62" font-size="12.5" fill="#94a3b8">How the five ESP32 tasks are described as sharing validated data (illustrative - confirm with the actual firmware)</text><rect x="60" y="80" width="270" height="100" rx="16" fill="url(#t1)" filter="url(#gl)"/><text x="195.0" y="114" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" letter-spacing="1">SENSOR TASK</text><text x="195.0" y="138" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Reads ToF sensors, updates</text><text x="195.0" y="155" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">distance + validity</text><rect x="60" y="350" width="270" height="100" rx="16" fill="url(#t2)" filter="url(#gl)"/><text x="195.0" y="384" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" letter-spacing="1">MAVLINK TASK</text><text x="195.0" y="408" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Receives / sends supported</text><text x="195.0" y="425" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">messages, handles timeouts</text><rect x="870" y="80" width="270" height="100" rx="16" fill="url(#t3)" filter="url(#gl)"/><text x="1005.0" y="114" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" letter-spacing="1">AVOIDANCE TASK</text><text x="1005.0" y="138" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Evaluates thresholds, selects</text><text x="1005.0" y="155" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">response, coordinates recovery</text><rect x="870" y="350" width="270" height="100" rx="16" fill="url(#t4)" filter="url(#gl)"/><text x="1005.0" y="384" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" letter-spacing="1">WEB-SERVER TASK</text><text x="1005.0" y="408" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Serves dashboard page with</text><text x="1005.0" y="425" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">status and sensor values</text><rect x="465" y="410" width="270" height="80" rx="16" fill="url(#t5)" filter="url(#gl)"/><text x="600.0" y="444" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" letter-spacing="1">SERIAL / DEBUG TASK</text><text x="600.0" y="468" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Diagnostic output only</text><text x="600.0" y="485" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">(must not block critical work)</text><rect x="450" y="190" width="300" height="140" rx="22" fill="url(#sh)" filter="url(#gl)"><animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/></rect><text x="600" y="240" text-anchor="middle" font-size="18" font-weight="900" fill="#451a03" letter-spacing="1.5">VALIDATED</text><text x="600" y="266" text-anchor="middle" font-size="18" font-weight="900" fill="#451a03" letter-spacing="1.5">SHARED STATE</text><text x="600" y="298" text-anchor="middle" font-size="11.5" fill="#78350f">distance values + validity + age</text><path d="M330,130 C400,130 400,215 450,225" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#60a5fa" filter="url(#gl)"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M330,130 C400,130 400,215 450,225"/></circle><circle r="5.5" fill="#60a5fa" filter="url(#gl)"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M330,130 C400,130 400,215 450,225"/></circle><path d="M330,400 C400,400 400,300 450,295" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#a5b4fc" filter="url(#gl)"><animateMotion dur="3s" begin="0.3s" repeatCount="indefinite" path="M330,400 C400,400 400,300 450,295"/></circle><circle r="5.5" fill="#a5b4fc" filter="url(#gl)"><animateMotion dur="3s" begin="1.8s" repeatCount="indefinite" path="M330,400 C400,400 400,300 450,295"/></circle><path d="M450,305 C390,330 380,420 330,410" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#a5b4fc" filter="url(#gl)"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M450,305 C390,330 380,420 330,410"/></circle><circle r="5.5" fill="#a5b4fc" filter="url(#gl)"><animateMotion dur="3s" begin="2.1s" repeatCount="indefinite" path="M450,305 C390,330 380,420 330,410"/></circle><path d="M750,225 C800,215 800,130 870,130" fill="none" stroke="#fca5a5" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#fca5a5" filter="url(#gl)"><animateMotion dur="3s" begin="0.8999999999999999s" repeatCount="indefinite" path="M750,225 C800,215 800,130 870,130"/></circle><circle r="5.5" fill="#fca5a5" filter="url(#gl)"><animateMotion dur="3s" begin="2.4s" repeatCount="indefinite" path="M750,225 C800,215 800,130 870,130"/></circle><path d="M870,170 C700,60 330,60 200,350" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#f87171" filter="url(#gl)"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M870,170 C700,60 330,60 200,350"/></circle><circle r="5.5" fill="#f87171" filter="url(#gl)"><animateMotion dur="3s" begin="2.7s" repeatCount="indefinite" path="M870,170 C700,60 330,60 200,350"/></circle><path d="M750,295 C800,310 800,400 870,400" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-dasharray="7 7" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#d8b4fe" filter="url(#gl)"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M750,295 C800,310 800,400 870,400"/></circle><circle r="5.5" fill="#d8b4fe" filter="url(#gl)"><animateMotion dur="3s" begin="3.0s" repeatCount="indefinite" path="M750,295 C800,310 800,400 870,400"/></circle><path d="M600,330 L600,410" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="3 6" opacity="0.7"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path><circle r="5.5" fill="#cbd5e1" filter="url(#gl)"><animateMotion dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" path="M600,330 L600,410"/></circle><circle r="5.5" fill="#cbd5e1" filter="url(#gl)"><animateMotion dur="3s" begin="3.3s" repeatCount="indefinite" path="M600,330 L600,410"/></circle><text x="395" y="105" font-size="11" font-weight="800" fill="#93c5fd">distance</text><text x="790" y="170" font-size="11" font-weight="800" fill="#fca5a5">state</text><text x="520" y="50" text-anchor="middle" font-size="11" font-weight="800" fill="#f87171" letter-spacing="1">response command to MAVLink task</text><text x="805" y="365" font-size="11" font-weight="800" fill="#d8b4fe">snapshot</text><text x="40" y="520" font-size="12" fill="#94a3b8">Dashboard refresh is described as about 500 ms. Sensor, MAVLink, web and decision-loop rates may differ - measure them rather than assume.</text></svg>
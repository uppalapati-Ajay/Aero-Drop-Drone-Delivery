<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Animated five-step mission flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.12"/></pattern><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="20" fill="#0b1226"/><rect width="100%" height="100%" rx="20" fill="url(#gr)"/><text x="40" y="44" font-size="22" font-weight="900" fill="#e0f2fe" letter-spacing="3">FIVE-STEP MISSION FLOW</text><line x1="140" y1="130" x2="1060" y2="130" stroke="#334155" stroke-width="6" stroke-linecap="round"/><line x1="140" y1="130" x2="1060" y2="130" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></line><circle cx="140" cy="130" r="46" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0"><animate attributeName="r" values="46;66;66" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="140" cy="130" r="42" fill="#0ea5e9" filter="url(#gl)"/><text x="140" y="141" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">1</text><text x="140" y="210" text-anchor="middle" font-size="18" font-weight="900" fill="#0ea5e9" letter-spacing="2">SENSE</text><text x="140" y="234" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Read front, left and right ToF</text><circle cx="370" cy="130" r="46" fill="none" stroke="#f97316" stroke-width="3" opacity="0"><animate attributeName="r" values="46;66;66" dur="10s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" dur="10s" begin="2s" repeatCount="indefinite"/></circle><circle cx="370" cy="130" r="42" fill="#f97316" filter="url(#gl)"/><text x="370" y="141" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">2</text><text x="370" y="210" text-anchor="middle" font-size="18" font-weight="900" fill="#f97316" letter-spacing="2">DECIDE</text><text x="370" y="234" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Check distance threshold</text><circle cx="600" cy="130" r="46" fill="none" stroke="#16a34a" stroke-width="3" opacity="0"><animate attributeName="r" values="46;66;66" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle><circle cx="600" cy="130" r="42" fill="#16a34a" filter="url(#gl)"/><text x="600" y="141" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">3</text><text x="600" y="210" text-anchor="middle" font-size="18" font-weight="900" fill="#16a34a" letter-spacing="2">RESPOND</text><text x="600" y="234" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Choose a clearer direction</text><circle cx="830" cy="130" r="46" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0"><animate attributeName="r" values="46;66;66" dur="10s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" dur="10s" begin="6s" repeatCount="indefinite"/></circle><circle cx="830" cy="130" r="42" fill="#8b5cf6" filter="url(#gl)"/><text x="830" y="141" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">4</text><text x="830" y="210" text-anchor="middle" font-size="18" font-weight="900" fill="#8b5cf6" letter-spacing="2">VERIFY</text><text x="830" y="234" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Re-check the path ahead</text><circle cx="1060" cy="130" r="46" fill="none" stroke="#14b8a6" stroke-width="3" opacity="0"><animate attributeName="r" values="46;66;66" dur="10s" begin="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" dur="10s" begin="8s" repeatCount="indefinite"/></circle><circle cx="1060" cy="130" r="42" fill="#14b8a6" filter="url(#gl)"/><text x="1060" y="141" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">5</text><text x="1060" y="210" text-anchor="middle" font-size="18" font-weight="900" fill="#14b8a6" letter-spacing="2">RESUME</text><text x="1060" y="234" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Continue waypoint mission</text><circle r="8" fill="#fff" filter="url(#gl)"><animateMotion dur="10s" repeatCount="indefinite" path="M140,130 L1060,130"/></circle></svg>